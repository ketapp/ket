name: Bug report
description: Report reproducible incorrect behavior
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not report security vulnerabilities here; use SECURITY.md.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the expected and actual behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Give the smallest safe sequence that reproduces the issue.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: ket version or commit
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: macOS and device versions
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Remove credentials, pairing codes, transcripts, and personal paths from logs.

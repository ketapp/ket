name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component clippy,rustfmt
      # ket-ui builds embedded Chromium by default: cef-rs compiles CEF's C++
      # wrapper with cmake, which the image has, and Ninja, which it may not.
      - name: Install Ninja
        run: command -v ninja >/dev/null || brew install ninja
      # The CEF distribution cef-rs downloads, ~135 MB, kept between runs for
      # the version Cargo.lock names.
      - name: Locate CEF
        id: cef
        run: |
          echo "CEF_PATH=$HOME/.cache/cef" >> "$GITHUB_ENV"
          echo "version=$(awk '$1 == "name" && $3 == "\"cef-dll-sys\"" { found = 1; next }
            found && $1 == "version" { gsub(/"/, "", $3); print $3; exit }' Cargo.lock)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/cef
          key: cef-${{ runner.os }}-${{ runner.arch }}-${{ steps.cef.outputs.version }}
      - run: cargo fmt --all --check
      - run: cargo check --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # Browser tabs without Chromium, on WebKit, still build.
      - run: cargo clippy -p ket-ui --no-default-features --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  mobile:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: npm ci --prefix mobile/remote
      - run: npm run generate --prefix mobile/remote
      - name: Generated protocol is current
        run: git diff --exit-code -- mobile/remote/src/gen
      - run: npm run typecheck --prefix mobile/remote
      - run: npm test --prefix mobile/remote
      - run: npm ci --prefix mobile/app
      - run: npm run typecheck --prefix mobile/app
      - run: npm run lint --prefix mobile/app
      - run: npm test --prefix mobile/app -- --runInBand

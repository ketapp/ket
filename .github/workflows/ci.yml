name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component clippy,rustfmt
      - run: cargo fmt --all --check
      - run: cargo check --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  mobile:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: npm ci --prefix mobile/remote
      - run: npm run generate --prefix mobile/remote
      - name: Generated protocol is current
        run: git diff --exit-code -- mobile/remote/src/gen
      - run: npm run typecheck --prefix mobile/remote
      - run: npm test --prefix mobile/remote
      - run: npm ci --prefix mobile/app
      - run: npm run typecheck --prefix mobile/app
      - run: npm run lint --prefix mobile/app
      - run: npm test --prefix mobile/app -- --runInBand

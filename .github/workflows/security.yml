name: Dependency security

on:
  pull_request:
    paths:
      - Cargo.lock
      - Cargo.toml
      - "crates/**/Cargo.toml"
      - "mobile/**/package-lock.json"
      - "mobile/**/package.json"
      - deny.toml
      - .github/npm-audit-allow.json
      - .github/scripts/npm-audit.mjs
  schedule:
    - cron: "23 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-advisories-and-licenses:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: cargo install cargo-deny --locked
      # A license or a source ket can't ship stops the run. An advisory is
      # only reported: it shows on the run as a failed step, never as a red
      # check, and gets fixed when it's worth fixing.
      - run: cargo deny check licenses sources
      - run: cargo deny check advisories
        continue-on-error: true

  npm-advisories:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      # `npm audit --audit-level=high`, minus the advisories with no patched
      # release that .github/npm-audit-allow.json lists, each with its reason.
      # Reported, never a red check, like the Rust advisories above.
      - run: node .github/scripts/npm-audit.mjs mobile/remote
        continue-on-error: true
      - run: node .github/scripts/npm-audit.mjs mobile/app
        continue-on-error: true
      - run: node .github/scripts/npm-audit.mjs scripts/checkpoint-xterm
        continue-on-error: true

name: Dependency security

on:
  pull_request:
    paths:
      - Cargo.lock
      - Cargo.toml
      - "crates/**/Cargo.toml"
      - "mobile/**/package-lock.json"
      - "mobile/**/package.json"
      - deny.toml
  schedule:
    - cron: "23 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-advisories-and-licenses:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: cargo install cargo-audit --locked
      - run: cargo install cargo-deny --locked
      - run: cargo audit
      - run: cargo deny check advisories licenses sources

  npm-advisories:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: npm audit --prefix mobile/remote --audit-level=high
      - run: npm audit --prefix mobile/app --audit-level=high
      - run: npm audit --prefix scripts/checkpoint-xterm --audit-level=high

[package]
name = "ket-android"
description = "The Android Emulator, driven over its public gRPC control API: finding the SDK and its emulators, booting one, its frames and its input."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
prost.workspace = true
tokio.workspace = true
tracing.workspace = true
# The emulator's own control API is gRPC over HTTP/2: a client only, no server
# and no axum, over the hyper / h2 / tower already in the tree.
tonic = { version = "0.14", default-features = false, features = ["channel", "codegen"] }
tonic-prost = "0.14"

[build-dependencies]
protox.workspace = true
tonic-prost-build = "0.14"

[lints]
workspace = true

[target."cfg(unix)".dependencies]
nix = { version = "0.31", default-features = false, features = ["signal"] }

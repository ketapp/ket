[package]
name = "ket-core"
description = "Engine for ket: projects, worktrees, agent sessions, and the event bus."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
agent-client-protocol.workspace = true
alacritty_terminal.workspace = true
base64.workspace = true
flate2.workspace = true
futures.workspace = true
getrandom.workspace = true
glob.workspace = true
globset.workspace = true
gix.workspace = true
http-body-util.workspace = true
hyper.workspace = true
hyper-rustls.workspace = true
hyper-util.workspace = true
notify.workspace = true
portable-pty.workspace = true
prost.workspace = true
regex.workspace = true
ring.workspace = true
ket-android.workspace = true
ket-relay-protocol.workspace = true
ket-relay.workspace = true
ket-remote.workspace = true
ropey.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util", "net"] }
# With TLS, for a relay elsewhere (#140): rustls and the operating system's
# root certificates, as the rest of the workspace.
tokio-tungstenite = { workspace = true, features = ["rustls-tls-native-roots"] }
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
ureq.workspace = true

[dev-dependencies]
rcgen.workspace = true
rustls.workspace = true
rustls-pki-types.workspace = true
tokio-rustls.workspace = true

[lints]
workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
libproc = "0.14"
nix = { version = "0.31", default-features = false, features = ["socket", "signal", "resource", "fs", "net"] }

[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "0.31", default-features = false, features = ["socket", "fs", "net"] }

# Deep green cards on a near-black desk, lit with lime and yellow.
#
# The ladder every other dark theme climbs — a desk darker than the cards
# set into it — so a phone, which draws its whole screen on the desk, reads
# it as it reads Desk. The acid is in the light: lime is spent on
# everything a highlight can be — the chrome accent, keywords, the cursor,
# "running", an added line — softened from neon so a full window of it
# does not glare. Yellow is the `marker`, "waiting on you", a modified line
# and strings; a paler step of either stands in for a third state. The dim
# ink is a sage rather than a yellow-green, so secondary text recedes
# instead of glowing. Red is kept for failures and removed lines only: a
# broken session has to look broken.

label = "Acid"
appearance = "dark"
backdrop = "#020904"
surface = "#07140a"
panel = "#07140a"
elevated = "#0d2212"
sunken = "#0a1a0d"
hover = "#0c1f10"

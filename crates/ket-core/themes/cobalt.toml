# Punk, inked in blue: a cobalt-black ground lit with electric blue and
# neon yellow.
#
# One ink changed and nothing else. Electric blue takes pink's place as the
# chrome accent and the keyword colour, with dark ink on it as Punk's pink
# has; the grounds are Punk's ladder turned from violet to cobalt, and the
# dim line is a strong periwinkle where Punk's is lavender. The rest is
# Punk's own: neon yellow is the `marker` and the strings, cyan carries
# types, hunks and "waiting on you" — far lighter than the blue, so the two
# never read as one — a mint `running` and a traffic-cone `failed`. Merges
# take a violet a step redder than the accent.

label = "Cobalt"
appearance = "dark"
backdrop = "#020409"
surface = "#070c1c"
panel = "#070c1c"
elevated = "#0f1734"
sunken = "#0b132c"
hover = "#101a3a"
selection = "#16287a"
border = "#26409a"
rule = "#111a36"
marker = "#f2ff26"
accent = "#3f7bff"
accent_hover = "#7aa3ff"
on_accent = "#000514"
focus_ring = "#f2ff26"

[text]

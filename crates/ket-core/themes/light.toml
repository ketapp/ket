# The shipped light theme: Desk, in daylight.
#
# The same ladder as `dark` turned over — white cards on a cool
# grey desk, wells a step down into it, floats pure white — with the same
# rules: `accent` is ink rather than a hue, `marker` is the one warm
# colour and only ever means "you are here", and the signal colours are
# darkened until they clear the same bars on white that `dark`'s clear on
# near-black. Neutral and slightly cool, as `dark` is; the warm paper it
# replaces belonged to the theme before Desk.

label = "Light"
appearance = "light"
backdrop = "#e4e7ec"
surface = "#fafbfc"
panel = "#fafbfc"
elevated = "#ffffff"
sunken = "#eef0f3"
hover = "#f0f2f5"
selection = "#e1e5eb"
border = "#cdd2d9"
rule = "#e4e7ec"
marker = "#b45309"
accent = "#111418"
accent_hover = "#000000"
on_accent = "#fafbfc"
focus_ring = "#111418"

[text]
primary = "#111418"
dim = "#545b66"

[diff]
added = "#15803d"
removed = "#c81e3a"
modified = "#a15c00"
context = "#545b66"
hunk_header = "#a15c00"

[status]

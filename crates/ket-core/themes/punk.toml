# A near-black violet ground lit with hot pink and neon yellow.
#
# The one shipped theme that does not whisper. Pink is the chrome
# accent and the keyword colour; neon yellow is the `marker` and the
# strings; cyan carries types, hunks and "waiting on you". Unlike its
# siblings it recolours status too — a mint `running` and a
# traffic-cone `failed` belong to the same poster, and the meanings stay
# where they were: green is progress, red is broken.

label = "Punk"
appearance = "dark"
backdrop = "#060209"
surface = "#110818"
panel = "#110818"
elevated = "#1f0f2c"
sunken = "#1a0c25"
hover = "#221030"
selection = "#3d1248"
border = "#4a1f5e"
rule = "#23122f"
marker = "#f2ff26"
accent = "#ff2d95"
accent_hover = "#ff5cae"
on_accent = "#16000b"
focus_ring = "#f2ff26"

[text]

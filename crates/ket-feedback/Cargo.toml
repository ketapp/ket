[package]
name = "ket-feedback"
description = "Receives feedback reports from ket and emails them to one address."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# Deliberately without `ket-core`: this runs on a server, not on anyone's
# Mac, and the one thing it shares with the app is the shape of a report.
[dependencies]
http-body-util.workspace = true
hyper.workspace = true
hyper-util.workspace = true
lettre.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["net"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true

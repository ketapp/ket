[package]
name = "ket-relay"
description = "The relay between phones and ket hosts: forwards ciphertext it cannot read."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# Deliberately without `ket-remote` or `ket-core`: the relay routes frames
# and cannot decode what is in them.
[dependencies]
futures.workspace = true
ket-relay-protocol.workspace = true
# Checking a host's proof of its id (#141): X25519, HMAC-SHA256, SHA-256.
ring.workspace = true
tokio = { workspace = true, features = ["io-util", "net"] }
tokio-tungstenite.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

# A real host's side of the proof, in the tests alone: the relay itself
# still cannot name what it carries.
[dev-dependencies]
ket-remote.workspace = true

[lints]
workspace = true

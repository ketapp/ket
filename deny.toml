[advisories]
yanked = "deny"
# Crates that are unmaintained only block the check when ket depends on them
# itself. The rest sit deep in gpui's and the image codecs' trees, where the
# fix is theirs to make, not ours.
unmaintained = "workspace"

[licenses]
confidence-threshold = 0.8
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-1-Clause",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "NCSA",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

# Only in the tree to build embedded Chromium: cef-rs's build script
# downloads CEF's distribution over rustls with Mozilla's root certificates
# and unpacks it with a Rust bzip2. Neither ships in ket.
[[licenses.exceptions]]
crate = "webpki-roots"
allow = ["CDLA-Permissive-2.0"]

[[licenses.exceptions]]
crate = "libbz2-rs-sys"
allow = ["bzip2-1.0.6"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
